<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="/static/images/favicon.ico" sizes="any">

    <link rel="stylesheet" type="text/css" href="/static/css/colors.css">
    <link rel="stylesheet" type="text/css" href="/static/css/layout.css">
    <link rel="stylesheet" type="text/css" href="/static/css/sidebar.css">
    <link rel="stylesheet" type="text/css" href="/static/css/cards.css">
    <link rel="stylesheet" type="text/css" href="/static/css/inputs.css">
    <link rel="stylesheet" type="text/css" href="/static/css/tooltips.css">
    <link rel="stylesheet" type="text/css" href="/static/css/pixel-corners.css">

    <script src="/static/js/pako-v2.0.4.min.js"></script>
    <script src="/static/js/anime-v4.2.2.umd.min.js"></script>
    <script src="/static/js/vanila-tilt-v1.8.1.min.js"></script>
    <script src="/static/js/script.js"></script>
    <script src="/static/js/animation.js" defer></script>

    <title>Balatro Completionist++ Tracker</title>
  </head>
  <body>

    <canvas id="background"></canvas>

    <div id="sidebar-wrapper">
      <div id="sidebar">

        <div id="title" class="pixel-corners-2x8">Completionist++</div>

        <label id="upload" class="pixel-corners-2x8">
          Upload Profile
          <input id="upload-input" type="file" accept=".jkr" />
        </label>

        <div id="statistic">
          <div class="progress-bar-wrapper pixel-corners-2x4" data-rarity="all">
            <h3>All</h3>
            <div class="progress-bar pixel-corners-2x2">
              <h3></h3>
            </div>
          </div>
          <div class="progress-bar-wrapper pixel-corners-2x4" data-rarity="4">
            <h3 style="color: #AB5BB5;">Legendary</h3>
            <div class="progress-bar pixel-corners-2x2">
              <h3></h3>
            </div>
          </div>
          <div class="progress-bar-wrapper pixel-corners-2x4" data-rarity="3">
            <h3 style="color: #FF4C40;">Rare</h3>
            <div class="progress-bar pixel-corners-2x2">
              <h3></h3>
            </div>
          </div>
          <div class="progress-bar-wrapper pixel-corners-2x4" data-rarity="2">
            <h3 style="color: #35BD86;">Uncommon</h3>
            <div class="progress-bar pixel-corners-2x2">
              <h3></h3>
            </div>
          </div>
          <div class="progress-bar-wrapper pixel-corners-2x4" data-rarity="1">
            <h3 style="color: #0093FF;">Common</h3>
            <div class="progress-bar pixel-corners-2x2">
              <h3></h3>
            </div>
          </div>
        </div>

        <label id="search" class="pixel-corners-2x8">
          <input id="search-input" type="search" placeholder="Search Joker..." autocomplete="off" />
        </label>

        <div id="filters-group">
          <div class="pixel-corners-2x8">
            <h1>Rarity</h1>
            <div class="checkbox-wrapper">
              <input class="inp-cbx" name="rarity" id="rarity-legendary" value="4" checked type="checkbox"/>
              <label class="cbx" for="rarity-legendary">
                <span class="pixel-corners-2x2">
                  <div class="pixel-corners-2x2">
                    <svg width="1rem" height="1rem" viewBox="0 0 24 24" id="check"><polyline id="primary" points="5 12 10 17 19 8" style="fill: none; stroke: rgb(255, 255, 255); stroke-width: 3;"></polyline></svg>
                  </div>
                </span>
                <span>Legendary</span>
              </label>
            </div>
            <div class="checkbox-wrapper">
              <input class="inp-cbx" name="rarity" id="rarity-rare" value="3" checked type="checkbox"/>
              <label class="cbx" for="rarity-rare">
                <span class="pixel-corners-2x2">
                  <div class="pixel-corners-2x2">
                    <svg width="1rem" height="1rem" viewBox="0 0 24 24" id="check"><polyline id="primary" points="5 12 10 17 19 8" style="fill: none; stroke: rgb(255, 255, 255); stroke-width: 3;"></polyline></svg>
                  </div>
                </span>
                <span>Rare</span>
              </label>
            </div>
            <div class="checkbox-wrapper">
              <input class="inp-cbx" name="rarity" id="rarity-uncommon" value="2" checked type="checkbox"/>
              <label class="cbx" for="rarity-uncommon">
                <span class="pixel-corners-2x2">
                  <div class="pixel-corners-2x2">
                    <svg width="1rem" height="1rem" viewBox="0 0 24 24" id="check"><polyline id="primary" points="5 12 10 17 19 8" style="fill: none; stroke: rgb(255, 255, 255); stroke-width: 3;"></polyline></svg>
                  </div>
                </span>
                <span>Uncommon</span>
              </label>
            </div>
            <div class="checkbox-wrapper">
              <input class="inp-cbx" name="rarity" id="rarity-common" value="1" checked type="checkbox"/>
              <label class="cbx" for="rarity-common">
                <span class="pixel-corners-2x2">
                  <div class="pixel-corners-2x2">
                    <svg width="1rem" height="1rem" viewBox="0 0 24 24" id="check"><polyline id="primary" points="5 12 10 17 19 8" style="fill: none; stroke: rgb(255, 255, 255); stroke-width: 3;"></polyline></svg>
                  </div>
                </span>
                <span>Common</span>
              </label>
            </div>
          </div>

          <div class="pixel-corners-2x8">
            <h1>Sticker</h1>
            <div class="checkbox-wrapper">
              <input class="inp-cbx" name="sticker" id="sticker-yes" value="yes" checked type="checkbox"/>
              <label class="cbx" for="sticker-yes">
                <span class="pixel-corners-2x2">
                  <div class="pixel-corners-2x2">
                    <svg width="1rem" height="1rem" viewBox="0 0 24 24" id="check"><polyline id="primary" points="5 12 10 17 19 8" style="fill: none; stroke: rgb(255, 255, 255); stroke-width: 3;"></polyline></svg>
                  </div>
                </span>
                <span>Yes</span>
              </label>
            </div>
            <div class="checkbox-wrapper">
              <input class="inp-cbx" name="sticker" id="sticker-no" value="no" checked type="checkbox"/>
              <label class="cbx" for="sticker-no">
                <span class="pixel-corners-2x2">
                  <div class="pixel-corners-2x2">
                    <svg width="1rem" height="1rem" viewBox="0 0 24 24" id="check"><polyline id="primary" points="5 12 10 17 19 8" style="fill: none; stroke: rgb(255, 255, 255); stroke-width: 3;"></polyline></svg>
                  </div>
                </span>
                <span>No</span>
              </label>
            </div>
          </div>

          <div class="pixel-corners-2x8">
            <h1>Sort</h1>
            <div class="radio-wrapper">
              <input class="inp-cbx" name="sort" id="sort-name" value="name" checked type="radio"/>
              <label class="cbx" for="sort-name">
                <span class="pixel-corners-2x4">
                  <div class="pixel-corners-2x4">
                    <div class="pixel-corners-2x2"></div>
                  </div>
                </span>
                <span>Name</span>
              </label>
            </div>
            <div class="radio-wrapper">
              <input class="inp-cbx" name="sort" id="sort-rarity" value="rarity" type="radio"/>
              <label class="cbx" for="sort-rarity">
                <span class="pixel-corners-2x4">
                  <div class="pixel-corners-2x4">
                    <div class="pixel-corners-2x2"></div>
                  </div>
                </span>
                <span>Rarity</span>
              </label>
            </div>
          </div>
        </div>

        <a
          id="github-link"
          class="pixel-corners-2x8"
          href="https://github.com/blackfan321/balatro-completionist-plus-plus-tracker"
          target="_blank"
          rel="noopener noreferrer"
        >
          View on GitHub
        </a>

      </div>
    </div>

    <div id="card-grid-wrapper">
      <div id="card-grid-background" class="pixel-corners-2x16"></div>
      <div id="card-grid"></div>
    </div>

  </body>
</html>
